
name: PR Collaboration Snapshot (Jan 1–19, 2026)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  pr_collab_snapshot:
    runs-on: ubuntu-latest

    steps:

      - name: Install jq
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Search PRs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          QUERY="repo:aemsites/idfc is:pr created:2026-01-01..2026-01-19"
          ENCODED=$(echo "$QUERY" | sed 's/ /+/g')
          curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/search/issues?q=${ENCODED}" \
            > prs.json

          jq '.items[].number' prs.json
