
name: PR Collaboration Snapshot (Phase C)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  pr_collab_phase_c:
    runs-on: ubuntu-latest

    steps:
      - name: Install jq
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Fetch PRs list
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          QUERY="repo:aemsites/idfc is:pr created:2026-01-01..2026-01-19"
          ENCODED=$(echo "$QUERY" | sed 's/ /+/g')
          curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/search/issues?q=${ENCODED}&per_page=100" \
            > prs.json

          jq -r '.items[].number' prs.json > pr_numbers.txt
          echo "PRs detected:"
          cat pr_numbers.txt

      - name: Generate raw analytics (metrics.csv, reviews.tsv, review_code_comments.tsv)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "pr_number,created_at,merged_at" > metrics.csv
          echo -e "pr_number\treviewer\tstate\tsubmitted_at" > reviews.tsv
          echo -e "pr_number\treviewer\tcomment_id\tcreated_at" > review_code_comments.tsv

          while read -r PR; do
            [ -z "$PR" ] && continue

            PR_JSON=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/aemsites/idfc/pulls/${PR}")

            CREATED=$(echo "$PR_JSON" | jq -r '.created_at')
            MERGED_AT=$(echo "$PR_JSON" | jq -r '.merged_at')
            echo "${PR},${CREATED},${MERGED_AT}" >> metrics.csv

            # Review events
            curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/aemsites/idfc/pulls/${PR}/reviews" \
              | jq -r --arg pr "$PR" '.[] | [$pr, .user.login, .state, .submitted_at] | @tsv' \
              >> reviews.tsv

            # Inline code review comments
            curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/aemsites/idfc/pulls/${PR}/comments" \
              | jq -r --arg pr "$PR" '.[] | [$pr, .user.login, .id, .created_at] | @tsv' \
              >> review_code_comments.tsv

          done < pr_numbers.txt

      - name: Build reviewer-load table
        shell: bash
        run: |
          set -euo pipefail

          # Write CSV header (no line continuation, no backslash)
          echo "reviewer,prs_reviewed,total_reviews,approvals,changes_requested,comments,other,code_review_comments" > reviewer_load.csv

          # PHASE C PART 1 — Aggregate review events
          # Format: pr_number <tab> reviewer <tab> state <tab> submitted_at
          declare -A TOTAL REV_APPR REV_CHG REV_COMM REV_OTHER
          declare -A UNIQUE_PR

          while IFS=$'\t' read -r pr reviewer state ts; do
            [[ "$reviewer" == "reviewer" ]] && continue
            [[ -z "$reviewer" ]] && continue

            TOTAL["$reviewer"]=$(( ${TOTAL["$reviewer"]:-0} + 1 ))

            case "$state" in
              APPROVED)          REV_APPR["$reviewer"]=$(( ${REV_APPR["$reviewer"]:-0} + 1 )) ;;
              CHANGES_REQUESTED) REV_CHG["$reviewer"]=$(( ${REV_CHG["$reviewer"]:-0} + 1 )) ;;
              COMMENTED)         REV_COMM["$reviewer"]=$(( ${REV_COMM["$reviewer"]:-0} + 1 )) ;;
              *)                 REV_OTHER["$reviewer"]=$(( ${REV_OTHER["$reviewer"]:-0} + 1 )) ;;
            esac

            UNIQUE_KEY="${reviewer}|${pr}"
            if [[ -z "${UNIQUE_PR[$UNIQUE_KEY]+x}" ]]; then
              UNIQUE_PR[$UNIQUE_KEY]=1
            fi
          done < reviews.tsv

          # Count unique PRs per reviewer
          declare -A PRS_REVIEWED
          for key in "${!UNIQUE_PR[@]}"; do
            reviewer="${key%%|*}"
            PRS_REVIEWED["$reviewer"]=$(( ${PRS_REVIEWED["$reviewer"]:-0} + 1 ))
          done

          # PHASE C PART 2 — Aggregate inline diff comments
          declare -A CODE_COMM
          while IFS=$'\t' read -r pr reviewer cid created; do
            [[ "$reviewer" == "reviewer" ]] && continue
            [[ -z "$reviewer" ]] && continue
            CODE_COMM["$reviewer"]=$(( ${CODE_COMM["$reviewer"]:-0} + 1 ))
          done < review_code_comments.tsv

          # PHASE C PART 3 — Write unified reviewer_load.csv
          declare -A ALL_REVIEWERS
          for r in "${!TOTAL[@]}"; do ALL_REVIEWERS["$r"]=1; done
          for r in "${!CODE_COMM[@]}"; do ALL_REVIEWERS["$r"]=1; done

          for r in "${!ALL_REVIEWERS[@]}"; do
            echo "$r,$((${PRS_REVIEWED[$r]:-0})),$((${TOTAL[$r]:-0})),$((${REV_APPR[$r]:-0})),$((${REV_CHG[$r]:-0})),$((${REV_COMM[$r]:-0})),$((${REV_OTHER[$r]:-0})),$((${CODE_COMM[$r]:-0}))" \
              >> reviewer_load.csv
          done

          echo "Preview reviewer_load.csv:"
          head -n 10 reviewer_load.csv || true
