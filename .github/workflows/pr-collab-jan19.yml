
name: PR Collaboration Snapshot (Phase B - Safe)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  pr_collab_phase_b:
    runs-on: ubuntu-latest

    steps:
      - name: Install jq
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Fetch PRs list
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          QUERY="repo:aemsites/idfc is:pr created:2026-01-01..2026-01-19"
          ENCODED=$(echo "$QUERY" | sed 's/ /+/g')
          curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/search/issues?q=${ENCODED}&per_page=100" \
            > prs.json

          jq -r '.items[].number' prs.json > pr_numbers.txt
          echo "PRs detected:"
          cat pr_numbers.txt

      - name: Generate raw analytics files
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "pr_number,created_at,merged_at" > metrics.csv
          echo -e "pr_number\treviewer\tstate\tsubmitted_at" > reviews.tsv
          echo -e "pr_number\treviewer\tcomment_id\tcreated_at" > review_code_comments.tsv

          while read -r PR; do
            [ -z "$PR" ] && continue

            # PR core metadata
            PR_JSON=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/aemsites/idfc/pulls/${PR}")

            CREATED=$(echo "$PR_JSON" | jq -r '.created_at')
            MERGED_AT=$(echo "$PR_JSON" | jq -r '.merged_at')

            echo "${PR},${CREATED},${MERGED_AT}" >> metrics.csv

            # Review events (state + submitted_at)
            curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/aemsites/idfc/pulls/${PR}/reviews" \
              | jq -r --arg pr "$PR" '.[] | [$pr, .user.login, .state, .submitted_at] | @tsv' \
              >> reviews.tsv

            # Inline code review comments (diff comments)
            curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/aemsites/idfc/pulls/${PR}/comments" \
              | jq -r --arg pr "$PR" '.[] | [$pr, .user.login, .id, .created_at] | @tsv' \
              >> review_code_comments.tsv

          done < pr_numbers.txt

          echo "Generated files:"
          ls -l metrics.csv reviews.tsv review_code_comments.tsv

      - name: Upload phase B raw data
        uses: actions/upload-artifact@v4
        with:
          name: pr-phase-b-raw
          path: |
            prs.json
            pr_numbers.txt
            metrics.csv
            reviews.tsv
            review_code_comments.tsv
